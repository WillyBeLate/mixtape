name: Playlist auslesen
# Claude trägt im Chat eine Playlist-URL in tools/playlist-anfrage.txt ein und pusht – dann liest diese Action
# die Playlist mit den Spotify-Zugangsdaten aus und legt sie als tools/playlists/<id>.json ab.
on:
  push:
    paths: ["tools/playlist-anfrage.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: playlist
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auslesen
        run: node tools/playlist.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Speichern
        run: |
          git config user.name "mixtape-playlist"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/playlists
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Playlist ausgelesen"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; git rebase --abort 2>/dev/null || true; sleep 15; done
