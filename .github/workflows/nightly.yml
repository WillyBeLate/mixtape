name: Nächtliche Prüfung
on:
  schedule:
    - cron: "0 2 * * *"   # 3:00 Uhr (Winter) bzw. 4:00 Uhr (Sommer) deutscher Zeit
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
concurrency: nightly
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prüfen
        run: node tools/nightly.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Speichern & veröffentlichen
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mixtape-nachtpruefung"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ids.js geprueft.js tools/pruefen.json
          if git diff --cached --quiet; then echo "Nichts zu speichern."; exit 0; fi
          git commit -m "Nächtliche Prüfung: $(cat tools/.summary)"
          # Falls in der Zwischenzeit jemand gepusht hat: erst den neuen Stand holen, dann pushen (bis zu 3 Versuche)
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              # Neuer Stand von außen → UNSICHER/Lücken passend dazu neu berechnen
              node tools/unsicher.mjs >/dev/null && git add ids.js tools/pruefen.json && (git diff --cached --quiet || git commit -m "Prüfliste nach Abgleich aktualisiert")
              git push origin HEAD:main && ok=1 && break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          if [ -z "$ok" ]; then echo "Push fehlgeschlagen – Issues bleiben offen und werden morgen erneut übernommen."; exit 1; fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
      - name: Übernommene Korrekturen schließen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(cat tools/.issues 2>/dev/null); do
            gh issue comment "$n" -R "${{ github.repository }}" -b "✅ Übernommen in der nächtlichen Prüfung." || true
            gh issue close "$n" -R "${{ github.repository }}" || true
          done
          for n in $(cat tools/.bad 2>/dev/null); do
            gh issue comment "$n" -R "${{ github.repository }}" -b "⚠️ Diese Meldung konnte nicht gelesen werden (kein gültiger Korrektur-Block). Bitte in der App erneut über „Falscher Song?“ melden." || true
            gh issue close "$n" -R "${{ github.repository }}" -r "not planned" || true
          done
