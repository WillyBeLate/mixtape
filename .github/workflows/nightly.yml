name: Nächtliche Prüfung
on:
  schedule:
    - cron: "15 0 * * *"   # 1:15 Uhr (Winter) bzw. 2:15 Uhr (Sommer) deutscher Zeit
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
concurrency: nightly
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prüfen
        run: node tools/nightly.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Speichern & veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s tools/.summary ]; then
            git config user.name "mixtape-nachtpruefung"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A ids.js geprueft.js tools/pruefen.json index.html sw.js changelog.js
            git commit -m "Nächtliche Prüfung: $(cat tools/.summary)"
            git push
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages/builds || true
          else
            git add tools/pruefen.json && git diff --cached --quiet || (git config user.name "mixtape-nachtpruefung"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git commit -m "Nächtliche Prüfung: Prüfliste aktualisiert" && git push)
          fi
